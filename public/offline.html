<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Caja Simple</title>
    <!-- Todo va dentro de esta página: sin red, cualquier otro archivo (como /favicon.svg) no carga. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Cpath d='M8 13h16v11H8zm2-4h12v4H10zm6 8v4' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      /* Copia de tokens.css: esta página se sirve sola, sin el CSS de la app. */
      :root {
        color-scheme: light dark;
        --bg: light-dark(#faf8f5, #171310);
        --text: light-dark(#1f1a17, #f3eee8);
        --muted: light-dark(#6b625a, #b3a89c);
        --primary: light-dark(#b45309, #f0a04b);
        --on-primary: light-dark(#ffffff, #1f1a17);
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        font: 1rem/1.5 system-ui, sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      .logo { display: block; width: 3.5rem; height: 3.5rem; margin: 0 auto; }
      .logo rect { fill: var(--primary); }
      .logo path { stroke: var(--on-primary); }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); margin: 0 0 1.5rem; }
      button {
        font: inherit;
        font-weight: 700;
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--on-primary);
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="8" />
        <path d="M8 13h16v11H8zm2-4h12v4H10zm6 8v4" fill="none" stroke-width="2" stroke-linejoin="round" />
      </svg>
      <h1>Sin conexión</h1>
      <p>Esta página necesita internet. Si ya abriste Vender en este dispositivo, puedes seguir vendiendo ahí: las ventas se envían solas al volver la conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
